<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>Bilişim Teknolojileri Sınav Merkezi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f1f5f9; }
        .hidden { display: none !important; }
        
        #toast-container { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 1000; }
        .toast { background-color: #1e293b; color: white; padding: 12px 24px; border-radius: 8px; margin-top: 10px; opacity: 0; transition: opacity 0.3s; box-shadow: 0 4px 6px rgba(0,0,0,0.15); font-weight: 500;}
        .toast.show { opacity: 1; }
        .toast.error { background-color: #ef4444; }
        .toast.success { background-color: #10b981; }
        .toast.info { background-color: #3b82f6; }
        
        #pin-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 500;}

        .tab-btn { padding: 12px 24px; font-weight: 600; color: #64748b; border-bottom: 3px solid transparent; transition: all 0.2s; }
        .tab-btn.active { color: #4338ca; border-bottom: 3px solid #4338ca; background-color: #eef2ff; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .draggable { cursor: grab; user-select: none; }
        .draggable:active { cursor: grabbing; }
        .dropzone { min-height: 60px; border: 2px dashed #94a3b8; transition: background-color 0.2s; border-radius: 0.5rem; display: flex; flex-wrap: wrap; gap: 0.5rem; padding: 0.5rem;}
        .dropzone.dragover { background-color: #e2e8f0; border-color: #2563eb; }

        .confetti { position: fixed; width: 10px; height: 10px; z-index: 9999; animation: fall 3s linear forwards; }
        @keyframes fall { to { transform: translateY(100vh) rotate(720deg); } }

        @media print {
            body { background-color: white !important; }
            body * { visibility: hidden; }
            #teacher-panel-content, #teacher-panel-content * { visibility: visible; }
            #teacher-panel-content { position: absolute; left: 0; top: 0; width: 100%; padding: 15px; margin: 0; }
            #report-section, #report-section * { visibility: visible; }
            #report-section { position: absolute; left: 0; top: 0; width: 100%; padding: 15px; margin: 0; box-shadow: none; border: none; }
            .no-print { display: none !important; }
            .tab-btn { display: none !important; }
        }
        
        .analysis-table th, .analysis-table td { min-width: 40px; }
    </style>
</head>
<body class="text-gray-800">

    <header class="bg-indigo-800 text-white p-4 shadow-md sticky top-0 z-40 no-print">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-xl font-bold" id="header-school-name"><i class="fas fa-graduation-cap mr-2"></i>Bilişim Teknolojileri Uygulama Sınavı Merkezi</h1>
                <p class="text-sm text-indigo-200">1. Dönem 1. Sınav (20 Görev Dağılımlı)</p>
            </div>
            <div class="flex gap-2">
                <button onclick="showStudentLogin()" class="bg-indigo-600 hover:bg-indigo-700 px-4 py-2 rounded-lg text-sm font-semibold transition"><i class="fas fa-user-graduate mr-1"></i> Öğrenci Girişi</button>
                <button onclick="requestTeacherPin()" class="bg-amber-500 hover:bg-amber-600 text-amber-950 px-4 py-2 rounded-lg text-sm font-bold transition shadow"><i class="fas fa-cogs mr-1"></i> Öğretmen Paneli</button>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-4 md:p-6 mt-4">
        <!-- ÖĞRENCİ GİRİŞ EKRANI -->
        <div id="student-login-section" class="bg-white p-8 rounded-xl shadow-lg max-w-md mx-auto mt-8 border-t-4 border-indigo-600 no-print">
            <div class="text-center mb-6">
                <div class="bg-indigo-100 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-desktop text-4xl text-indigo-600"></i>
                </div>
                <h2 class="text-2xl font-bold text-gray-800">Sınav Girişi</h2>
                <p class="text-sm text-gray-500 mt-1">Öğretmeninizin listeye eklediği isminizi seçin.</p>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Sınıfınız</label>
                    <select id="student-class" onchange="loadStudentsForClass()" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-gray-50">
                        <option value="">Önce Sınıf Seçiniz...</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">İsminiz</label>
                    <select id="student-name" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-gray-50" disabled>
                        <option value="">Lütfen listeden adınızı seçin...</option>
                    </select>
                </div>
                <button onclick="startStudentExam()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg transition mt-4 flex items-center justify-center gap-2 shadow-lg">
                    <i class="fas fa-play"></i> Sınava Başla
                </button>
            </div>
        </div>

        <!-- ÖĞRETMEN PIN EKRANI -->
        <div id="pin-overlay" class="hidden">
            <div class="bg-white p-8 rounded-xl shadow-2xl max-w-sm w-full text-center">
                <div class="bg-amber-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-lock text-3xl text-amber-600"></i>
                </div>
                <h3 class="text-xl font-bold mb-2 text-gray-800">Öğretmen Yetkilendirmesi</h3>
                <p class="text-sm text-gray-500 mb-6">Panele erişmek için PIN kodunu giriniz (Varsayılan: 1234)</p>
                <input type="password" id="teacher-pin" class="w-full p-4 text-center text-3xl tracking-[0.5em] border-2 border-gray-300 rounded-lg mb-6 focus:outline-none focus:border-amber-500 bg-gray-50 font-mono" placeholder="••••" maxlength="4">
                <div class="flex gap-3">
                    <button onclick="closePinModal()" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-3 rounded-lg transition">İptal</button>
                    <button onclick="checkPin()" class="flex-1 bg-amber-500 hover:bg-amber-600 text-white font-bold py-3 rounded-lg shadow transition">Giriş Yap</button>
                </div>
            </div>
        </div>

        <!-- ÖĞRETMEN YÖNETİM PANELİ -->
        <div id="teacher-panel-section" class="hidden bg-white rounded-xl shadow-lg border-t-4 border-amber-500 relative overflow-hidden">
            <div class="flex border-b bg-gray-50 no-print flex-wrap">
                <button class="tab-btn active flex-1 md:flex-none text-center" onclick="switchTab('tab-settings')" id="btn-tab-settings">
                    <i class="fas fa-sliders-h mr-2"></i> Ayarlar & Veri Girişi
                </button>
                <button class="tab-btn flex-1 md:flex-none text-center" onclick="switchTab('tab-report')" id="btn-tab-report">
                    <i class="fas fa-list-ol mr-2"></i> Sınıf Puan Listesi
                </button>
                <button class="tab-btn flex-1 md:flex-none text-center bg-indigo-50 border-indigo-200" onclick="switchTab('tab-analysis')" id="btn-tab-analysis">
                    <i class="fas fa-chart-pie mr-2"></i> Kapsamlı Sınav Analizi
                </button>
            </div>

            <div id="teacher-panel-content" class="p-6">
                <!-- SEKME 1: AYARLAR -->
                <div id="tab-settings" class="tab-content active no-print">
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                        <div>
                            <h3 class="font-bold text-gray-800 mb-4 border-b pb-2"><i class="fas fa-building text-indigo-500 mr-2"></i>Kurum ve Genel Ayarlar</h3>
                            <div class="space-y-4 bg-gray-50 p-5 rounded-xl border border-gray-200">
                                <div>
                                    <label class="text-xs font-bold text-gray-600 uppercase">Okul Adı</label>
                                    <input type="text" id="set-school" class="w-full p-2 border rounded focus:ring-2 focus:ring-indigo-500">
                                </div>
                                <div class="grid grid-cols-2 gap-4">
                                    <div>
                                        <label class="text-xs font-bold text-gray-600 uppercase">Ders Öğretmeni</label>
